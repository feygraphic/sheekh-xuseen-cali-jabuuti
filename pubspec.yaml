name: sheekh_xuseen_cali_jabuuti
description: "Sheekh Xuseen Cali Jabuuti - Muxaadarooyinka, Duruusta, Qur'aanka iyo Adkaarta"
publish_to: 'none'

version: 1.0.5+18

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  google_fonts: ^9.0.0
  share_plus: ^13.3.1
  http: ^1.2.0
  url_launcher: ^6.3.3
  youtube_player_iframe: ^6.0.2
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  path_provider: ^2.1.5
  permission_handler: 11.3.1
  google_mobile_ads: ^9.2.0
  flutter_local_notifications: ^23.0.1
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
    - assets/data/
    - assets/data/morning_adhkar.json
    - assets/data/evening_adhkar.json
    - assets/data/quran/
    - assets/data/adhkar/
    - assets/fonts/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
          weight: 400
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSerif-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSerif-Bold.ttf
          weight: 700
